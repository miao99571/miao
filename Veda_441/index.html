<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ICTWEB441 - Week 2 Assignment</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <!-- 第一部分：个人资料页 -->
        <div class="card">
            <h2>Part 1: My Profile</h2>
            <div class="form-group">
                <label>Name:</label>
                <input type="text" id="name" placeholder="Enter your name">
            </div>
            <div class="form-group">
                <label>Hobbies:</label>
                <input type="text" id="hobbies" placeholder="e.g. coding, reading">
            </div>
            <div class="form-group">
                <label>Favorite Food:</label>
                <input type="text" id="food" placeholder="Your favorite food">
            </div>
            <div class="form-group">
                <label>Dream Job:</label>
                <input type="text" id="job" placeholder="Your dream job">
            </div>
            <button onclick="showStory()">Show My Story</button>
            <div id="storyResult" class="result"></div>
        </div>

        <!-- 第二部分：个人预算计算器 -->
        <div class="card">
            <h2>Part 2: Budget Calculator</h2>
            <div class="form-group">
                <label>Income ($):</label>
                <input type="number" id="income" placeholder="0.00">
            </div>
            <div class="form-group">
                <label>Food Expense ($):</label>
                <input type="number" id="foodCost" placeholder="0.00">
            </div>
            <div class="form-group">
                <label>Transport Expense ($):</label>
                <input type="number" id="transportCost" placeholder="0.00">
            </div>
            <div class="form-group">
                <label>Entertainment Expense ($):</label>
                <input type="number" id="entCost" placeholder="0.00">
            </div>
            <button onclick="calculateBalance()">Calculate Balance</button>
            <div id="balanceResult" class="result"></div>
        </div>

        <!-- 第三部分：喜好生成器 -->
        <div class="card">
            <h2>Part 3: Preference Generator</h2>
            <div class="form-group">
                <label>Favourite Movie:</label>
                <input type="text" id="movie" placeholder="Movie name">
            </div>
            <div class="form-group">
                <label>Favourite Music:</label>
                <input type="text" id="music" placeholder="Music genre/artist">
            </div>
            <div class="form-group">
                <label>Favourite Place:</label>
                <input type="text" id="place" placeholder="A place you love">
            </div>
            <button onclick="generateProfile()">Generate Profile</button>
            <div id="prefResult" class="result"></div>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
